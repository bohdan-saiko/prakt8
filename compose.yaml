services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: auth_lab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d auth_lab"]
      interval: 3s
      retries: 10
volumes:
  auth_db:
